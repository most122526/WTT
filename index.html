<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
    <title>💗 回到我身边</title>
    <style>
        :root{--pink-500:#ff5286;--pink-400:#ff7aa2;--pink-600:#e84572;--radius:20px;--safe-bottom:env(safe-area-inset-bottom,16px);--safe-top:env(safe-area-inset-top,16px)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei','STHeiti',sans-serif;background:#1a1a1a;min-height:100vh;min-height:100dvh;color:#fff;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:pan-y}
        .petals-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10}
        .petal{position:absolute;top:-60px;animation:fall linear infinite;opacity:0.5;font-size:1.2rem;filter:drop-shadow(0 0 3px rgba(255,255,255,0.25))}
        @keyframes fall{0%{transform:translateY(-60px) rotate(0deg) translateX(0px);opacity:0.6}25%{transform:translateY(25vh) rotate(90deg) translateX(30px);opacity:0.5}50%{transform:translateY(50vh) rotate(180deg) translateX(-25px);opacity:0.4}75%{transform:translateY(75vh) rotate(270deg) translateX(15px);opacity:0.25}100%{transform:translateY(105vh) rotate(360deg) translateX(-8px);opacity:0}}
        .page{position:fixed;top:0;left:0;width:100%;height:100%;height:100dvh;display:none;flex-direction:column;z-index:5}
        .page.active{display:flex}
        .home-page{justify-content:center;align-items:center;background:linear-gradient(180deg,#2d1520,#1a0d14,#0d0d0d,#1a1018);text-align:center;padding:40px 20px;gap:20px;overflow-y:auto;-webkit-overflow-scrolling:touch}
        .home-title{font-size:2.2rem;font-weight:300;letter-spacing:3px;color:#ff5286;text-shadow:0 0 30px rgba(255,82,134,0.5);animation:titleGlow 3s ease-in-out infinite;margin-bottom:4px}
        @keyframes titleGlow{0%,100%{text-shadow:0 0 20px rgba(255,82,134,0.4)}50%{text-shadow:0 0 40px rgba(255,82,134,0.8),0 0 80px rgba(255,130,160,0.4)}}
        .home-subtitle{font-size:0.85rem;color:rgba(255,255,255,0.5);letter-spacing:2px;line-height:1.6;white-space:pre-wrap;word-break:break-word;padding:0 10px}
        .home-modules{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px}
        .home-module-card{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.12);border-radius:16px;padding:14px 18px;cursor:pointer;transition:all 0.3s;text-align:center;min-width:70px;flex:1;max-width:100px}
        .home-module-card:active{background:rgba(255,255,255,0.14);transform:scale(0.96)}
        .home-module-card .module-icon{font-size:1.6rem;margin-bottom:4px}
        .home-module-card .module-label{font-size:0.68rem;color:rgba(255,255,255,0.6);letter-spacing:0.5px}
        .btn-start{background:linear-gradient(135deg,#ff5286,#ff7aa2);color:#fff;border:none;padding:16px 48px;border-radius:30px;cursor:pointer;font-size:1.05rem;font-weight:600;font-family:inherit;letter-spacing:2px;box-shadow:0 8px 30px rgba(255,82,134,0.35);animation:btnPulse 2.5s ease-in-out infinite;margin-top:8px}
        @keyframes btnPulse{0%,100%{box-shadow:0 8px 30px rgba(255,82,134,0.35)}50%{box-shadow:0 12px 45px rgba(255,82,134,0.6)}}
        .btn-start:active{transform:scale(0.95)}
        .home-config-btn{position:absolute;top:max(16px,var(--safe-top));right:16px;z-index:20;background:rgba(0,0,0,0.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.5);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:0.9rem;display:flex;align-items:center;justify-content:center}
        .content-page{background:#0d0d0d}
        .carousel-container{flex:1;position:relative;overflow:hidden;width:100%}
        .carousel-track{position:absolute;top:0;left:0;width:100%;height:100%;transition:transform 0.5s cubic-bezier(0.25,0.1,0.25,1);will-change:transform}
        .slide{position:absolute;top:0;width:100%;height:100%;overflow:hidden;display:flex;align-items:center;justify-content:center;background:#0d0d0d}
        .slide-bg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;display:flex;align-items:center;justify-content:center}
        .slide-bg img{width:auto;height:auto;max-width:100%;max-height:100%;object-fit:contain;display:block;filter:brightness(0.5)}
        .slide-bg video{width:100%;max-height:100%;object-fit:contain;display:block;filter:brightness(0.5)}
        .slide-bg .no-media{width:100%;height:100%;background:linear-gradient(160deg,#2d1520,#1a0d14,#0d0d0d)}
        .slide-overlay{position:absolute;bottom:0;left:0;width:100%;height:60%;background:linear-gradient(to top,rgba(0,0,0,0.9),rgba(0,0,0,0.55) 30%,rgba(0,0,0,0.1) 70%,transparent);z-index:2;pointer-events:none}
        .slide-text{position:absolute;bottom:0;left:0;width:100%;z-index:3;padding:20px 22px calc(100px + var(--safe-bottom));max-height:55vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
        .slide-text::-webkit-scrollbar{width:2px}.slide-text::-webkit-scrollbar-track{background:transparent}.slide-text::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.25);border-radius:8px}
        .slide-text .text-inner{font-size:0.95rem;line-height:1.9;letter-spacing:0.8px;text-shadow:0 2px 8px rgba(0,0,0,0.6);white-space:pre-wrap;word-break:break-word;padding-bottom:10px;color:rgba(255,255,255,0.9)}
        .section-tabs{position:absolute;top:max(12px,var(--safe-top));left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:4px;background:rgba(0,0,0,0.45);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:5px 6px;border-radius:22px;border:1px solid rgba(255,255,255,0.15)}
        .section-tab{padding:7px 13px;border-radius:18px;border:none;background:transparent;color:rgba(255,255,255,0.65);cursor:pointer;font-size:0.72rem;font-weight:600;font-family:inherit;transition:all 0.3s;white-space:nowrap}
        .section-tab.active{background:rgba(255,255,255,0.2);color:#fff}
        .section-tab.locked{color:rgba(255,255,255,0.35)}
        .section-tab.config-tab{font-size:0.9rem;padding:7px 10px;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:1px dashed rgba(255,255,255,0.2)}
        .nav-indicators{position:absolute;bottom:calc(70px + var(--safe-bottom));left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:8px}
        .nav-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.35);cursor:pointer;transition:all 0.3s}
        .nav-dot.active{background:#fff;box-shadow:0 0 10px rgba(255,255,255,0.5);width:20px;border-radius:8px}
        .swipe-hint{position:absolute;bottom:calc(50px + var(--safe-bottom));left:50%;transform:translateX(-50%);z-index:18;color:rgba(255,255,255,0.45);font-size:0.65rem;letter-spacing:1.5px;pointer-events:none;animation:hintPulse 2.5s ease-in-out infinite}
        @keyframes hintPulse{0%,100%{opacity:0.3}50%{opacity:0.8}}
        .music-indicator{position:absolute;bottom:calc(16px + var(--safe-bottom));right:14px;z-index:20;background:rgba(0,0,0,0.4);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:22px;padding:8px 14px;border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;gap:6px;font-size:0.7rem;font-weight:600;color:#fff;cursor:pointer}
        .music-indicator .dot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:pulse 1.2s ease-in-out infinite;display:none}
        .music-indicator .dot.playing{display:block}.music-indicator .dot.paused{display:block;background:#fb923c;animation:none}
        @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.3;transform:scale(1.6)}}
        .btn-back-home{position:absolute;top:max(50px,calc(var(--safe-top) + 38px));left:12px;z-index:20;background:rgba(0,0,0,0.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.7);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:0.8rem;display:flex;align-items:center;justify-content:center}
        .hidden-audio{display:none}
        .quiz-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:400;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
        .quiz-overlay.hidden{display:none}
        .quiz-box{background:rgba(30,30,30,0.95);border-radius:20px;padding:32px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5);max-width:340px;width:88%;border:1px solid rgba(255,255,255,0.15)}
        .quiz-box .quiz-icon{font-size:3rem;margin-bottom:12px}
        .quiz-box h3{font-size:1.1rem;color:#ff5286;margin-bottom:6px}
        .quiz-box .quiz-question{font-size:0.9rem;color:rgba(255,255,255,0.8);margin-bottom:18px;line-height:1.5}
        .quiz-box .quiz-hint{font-size:0.7rem;color:rgba(255,255,255,0.4);margin-bottom:12px}
        .quiz-box input{width:100%;border:2px solid rgba(255,255,255,0.2);border-radius:22px;padding:11px 16px;font-size:1rem;text-align:center;font-family:inherit;background:rgba(255,255,255,0.06);color:#fff;transition:all 0.3s;outline:none;margin-bottom:14px}
        .quiz-box input:focus{border-color:#ff5286;box-shadow:0 0 0 3px rgba(255,82,134,0.15)}
        .quiz-box .btn-submit{background:#ff5286;color:#fff;border:none;padding:11px 36px;border-radius:22px;cursor:pointer;font-size:0.95rem;font-weight:600;font-family:inherit}
        .quiz-box .quiz-error{color:#f87171;font-size:0.75rem;margin-top:8px;display:none}
        .quiz-box .quiz-error.show{display:block}
        .password-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:9999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
        .password-overlay.hidden{display:none}
        .password-box{background:rgba(30,30,30,0.9);border-radius:var(--radius);padding:36px 26px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5);max-width:340px;width:88%;border:1px solid rgba(255,255,255,0.15)}
        .password-box h2{font-size:1.2rem;color:#ff5286;margin-bottom:4px}
        .password-box .subtitle{font-size:0.75rem;color:rgba(255,255,255,0.4);margin-bottom:18px}
        .password-box input{width:100%;border:2px solid rgba(255,255,255,0.15);border-radius:22px;padding:11px 16px;font-size:0.95rem;text-align:center;font-family:inherit;letter-spacing:3px;background:rgba(255,255,255,0.06);color:#fff;transition:all 0.3s;outline:none}
        .password-box input:focus{border-color:#ff5286;box-shadow:0 0 0 3px rgba(255,82,134,0.15)}
        .password-box .btn-submit{margin-top:14px;background:#ff5286;color:#fff;border:none;padding:11px 36px;border-radius:22px;cursor:pointer;font-size:0.95rem;font-weight:600;font-family:inherit}
        .password-box .error-msg{color:#f87171;font-size:0.75rem;margin-top:8px;display:none}
        .password-box .error-msg.show{display:block}
        .password-box .btn-cancel{margin-top:6px;background:transparent;color:rgba(255,255,255,0.4);border:none;cursor:pointer;font-size:0.75rem;font-family:inherit;text-decoration:underline}
        .config-fullscreen{position:fixed;top:0;left:0;width:100%;height:100%;height:100dvh;z-index:500;background:rgba(18,18,18,0.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding:16px}
        .config-fullscreen.active{display:block}
        .config-inner{max-width:600px;margin:0 auto;padding-bottom:40px}
        .config-inner h2{color:#ff5286;margin-bottom:18px;font-size:1.1rem;text-align:center}
        .config-group{margin-bottom:16px;padding:14px;border-radius:14px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08)}
        .config-group h3{font-size:0.85rem;color:#ff5286;margin-bottom:8px}
        .config-group label{display:block;font-size:0.7rem;color:rgba(255,255,255,0.4);margin-bottom:3px;font-weight:600}
        .config-group input,.config-group textarea,.config-group select{width:100%;border:1.5px solid rgba(255,255,255,0.15);border-radius:10px;padding:9px 12px;font-size:0.8rem;font-family:inherit;background:rgba(255,255,255,0.05);color:#fff;transition:all 0.3s;margin-bottom:6px;resize:vertical}
        .config-group input:focus,.config-group textarea:focus,.config-group select:focus{outline:none;border-color:#ff5286;box-shadow:0 0 0 3px rgba(255,82,134,0.1)}
        .config-group textarea{min-height:60px}
        .toggle-switch{display:flex;align-items:center;gap:10px;margin-bottom:10px;cursor:pointer}
        .toggle-switch .toggle-track{width:44px;height:24px;border-radius:12px;background:rgba(255,255,255,0.2);position:relative;transition:background 0.3s;flex-shrink:0}
        .toggle-switch .toggle-track.active{background:#4ade80}
        .toggle-switch .toggle-thumb{width:20px;height:20px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:left 0.3s}
        .toggle-switch .toggle-track.active .toggle-thumb{left:22px}
        .toggle-switch .toggle-label{font-size:0.78rem;color:rgba(255,255,255,0.7)}
        .pair-editor{background:rgba(255,255,255,0.02);border-radius:10px;padding:16px 12px 12px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.06);position:relative}
        .pair-editor .pair-number{position:absolute;top:-9px;left:10px;background:#ff5286;color:#fff;font-size:0.65rem;padding:2px 9px;border-radius:8px;font-weight:700}
        .btn-add-pair{background:transparent;color:#ff5286;border:1.5px dashed rgba(255,82,134,0.35);padding:9px 18px;border-radius:18px;cursor:pointer;font-size:0.8rem;font-weight:600;font-family:inherit;transition:all 0.3s;width:100%}
        .btn-remove-pair{position:absolute;top:5px;right:8px;background:rgba(220,38,38,0.15);border:1px solid rgba(220,38,38,0.3);color:#f87171;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:0.7rem;display:flex;align-items:center;justify-content:center}
        .btn-save-config{background:#ff5286;color:#fff;border:none;padding:9px 18px;border-radius:18px;cursor:pointer;font-size:0.8rem;font-weight:600;font-family:inherit}
        .btn-generate{background:linear-gradient(135deg,#ff5286,#ff7aa2);color:#fff;border:none;padding:13px 28px;border-radius:22px;cursor:pointer;font-size:0.95rem;font-weight:700;font-family:inherit;letter-spacing:1px;display:block;width:100%;margin-top:8px}
        .btn-back-config{background:transparent;color:rgba(255,255,255,0.5);border:1px solid rgba(255,255,255,0.15);padding:7px 14px;border-radius:16px;cursor:pointer;font-size:0.75rem;font-family:inherit;margin-bottom:14px;display:inline-block}
        .music-item-editor{background:rgba(255,255,255,0.03);border-radius:10px;padding:14px 12px 10px;margin-bottom:8px;border:1px solid rgba(255,255,255,0.08);position:relative}
        .music-item-editor .music-number{position:absolute;top:-8px;left:10px;background:#4ade80;color:#000;font-size:0.6rem;padding:2px 8px;border-radius:7px;font-weight:700}
        .music-time-row{display:flex;gap:6px;align-items:center}
        .music-time-row input{flex:1;margin-bottom:0;text-align:center;font-size:0.75rem;padding:7px 8px}
        .music-time-row span{color:rgba(255,255,255,0.3);font-size:0.7rem;flex-shrink:0}
        .btn-remove-music-item{position:absolute;top:5px;right:8px;background:rgba(220,38,38,0.15);border:1px solid rgba(220,38,38,0.3);color:#f87171;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:0.7rem;display:flex;align-items:center;justify-content:center}
        .btn-add-music{background:transparent;color:#4ade80;border:1.5px dashed rgba(74,222,128,0.35);padding:8px 16px;border-radius:16px;cursor:pointer;font-size:0.75rem;font-weight:600;font-family:inherit;transition:all 0.3s;width:100%;margin-top:4px}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.8);color:#fff;padding:10px 22px;border-radius:20px;font-size:0.8rem;z-index:999;animation:toastIn 0.3s ease}
        @keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(15px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
    </style>
</head>
<body>
    <div class="petals-container" id="petalsContainer"></div>

    <div class="page active" id="pageHome">
        <div class="home-page">
            <div class="home-title" id="homeTitle">💗</div>
            <div class="home-subtitle" id="homeSubtitle">有些话，一直想对你说</div>
            <div class="home-modules" id="homeModules">
                <div class="home-module-card" data-section="memories"><div class="module-icon">💌</div><div class="module-label">我们的回忆</div></div>
                <div class="home-module-card" data-section="status"><div class="module-icon">💔</div><div class="module-label">目前的状态</div></div>
                <div class="home-module-card" data-section="solution"><div class="module-icon">💡</div><div class="module-label">解决办法</div></div>
                <div class="home-module-card" data-section="future"><div class="module-icon">🌈</div><div class="module-label">未来会好的</div></div>
            </div>
            <button class="btn-start" id="btnStart">轻触开始</button>
        </div>
        <button class="home-config-btn" id="homeConfigBtn" title="配置">⚙</button>
    </div>

    <div class="page content-page" id="pageContent">
        <div class="section-tabs" id="sectionTabs">
            <button class="section-tab active" data-section="memories">💌 回忆</button>
            <button class="section-tab locked" data-section="status" id="tabStatus">🔒 状态</button>
            <button class="section-tab locked" data-section="solution" id="tabSolution">🔒 办法</button>
            <button class="section-tab locked" data-section="future" id="tabFuture">🔒 未来</button>
            <button class="section-tab config-tab" data-section="config" title="配置">⚙</button>
        </div>
        <button class="btn-back-home" id="btnBackHome">←</button>
        <div class="carousel-container" id="carouselContainer"><div class="carousel-track" id="carouselTrack"></div></div>
        <div class="nav-indicators" id="navIndicators"></div>
        <div class="swipe-hint" id="swipeHint">← 左右滑动翻阅 →</div>
        <div class="music-indicator" id="musicIndicator"><span class="dot" id="musicDot"></span><span id="musicLabel">🎵</span></div>
    </div>

    <div class="password-overlay hidden" id="passwordOverlay">
        <div class="password-box">
            <h2>🔐 密码</h2><p class="subtitle">进入配置需验证</p>
            <input type="password" id="passwordInput" placeholder="输入密码" maxlength="20">
            <div class="error-msg" id="passwordError">❌ 密码错误</div>
            <button class="btn-submit" id="btnPasswordSubmit">确 认</button>
            <button class="btn-cancel" id="btnPasswordCancel">取消</button>
        </div>
    </div>

    <div class="config-fullscreen" id="configFullscreen">
        <div class="config-inner">
            <button class="btn-back-config" id="btnBackConfig">← 返回</button>
            <h2>⚙️ 配置面板</h2>
            <div class="config-group"><h3>🏠 主页设置</h3><label>主页大标题</label><input type="text" id="configHomeTitle"><label>主页副标题</label><textarea id="configHomeSubtitle"></textarea></div>
            <div class="config-group"><h3>📝 选择编辑板块</h3><div style="display:flex;gap:4px;flex-wrap:wrap;"><button class="section-tab config-target-btn active" data-target="memories" style="font-size:0.7rem;">💌 回忆</button><button class="section-tab config-target-btn" data-target="status" style="font-size:0.7rem;">💔 状态</button><button class="section-tab config-target-btn" data-target="solution" style="font-size:0.7rem;">💡 办法</button><button class="section-tab config-target-btn" data-target="future" style="font-size:0.7rem;">🌈 未来</button></div></div>
            <div class="config-group"><h3>🖼️ 图文对</h3><div id="pairsEditor"></div><button class="btn-add-pair" id="btnAddPair">＋ 添加</button></div>
            <div class="config-group"><h3>🔊 视频声音设置</h3><div class="toggle-switch" id="toggleVideoMuted"><div class="toggle-track active" id="toggleTrack"><div class="toggle-thumb"></div></div><span class="toggle-label" id="toggleVideoLabel">视频静音</span></div></div>
            <div class="config-group"><h3>🎵 当前板块背景音乐（最多5首）</h3><div id="musicListEditor"></div><button class="btn-add-music" id="btnAddMusic">＋ 添加歌曲</button><div style="margin-top:6px;display:flex;gap:6px;align-items:center;"><button class="btn-save-config" id="btnPreviewMusic">🔊 试听第一首</button><span id="musicStatus" style="font-size:0.7rem;color:rgba(255,255,255,0.4);"></span></div></div>
            <button class="btn-generate" id="btnGenerate">📥 保存并生成最终页面</button>
        </div>
    </div>

    <div class="quiz-overlay hidden" id="quizOverlay">
        <div class="quiz-box">
            <div class="quiz-icon" id="quizIcon">🔐</div>

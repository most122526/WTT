<!DOCTYPE html>
        <html lang="zh-CN">
        <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>💗 回到我身边</title>
        <style>
            :root {
                --pink-50:#fff1f5;--pink-100:#ffe4ec;--pink-200:#ffc8da;--pink-300:#ffa3bf;
                --pink-400:#ff7aa2;--pink-500:#ff5286;--pink-600:#e84572;--white:#ffffff;
                --text:#4a3040;--text-light:#8b6b7d;--shadow:0 4px 20px rgba(255,130,160,0.2);
                --shadow-lg:0 10px 40px rgba(255,130,160,0.25);--radius:20px;--radius-sm:12px;
            }
            *{margin:0;padding:0;box-sizing:border-box;}
            body{
                font-family:'PingFang SC','Noto Sans SC','Microsoft YaHei','STHeiti',sans-serif;
                background:linear-gradient(180deg,#ffe4ec 0%,#ffd4e0 15%,#ffe8f0 30%,#fff0f5 50%,#ffe4ec 70%,#ffdce8 100%);
                min-height:100vh;color:var(--text);position:relative;overflow-x:hidden;cursor:default;
            }
            .petals-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;}
            .petal{position:absolute;top:-60px;animation:fall linear infinite;opacity:0.7;font-size:1.5rem;}
            @keyframes fall{
                0%{transform:translateY(-60px) rotate(0deg) translateX(0px);opacity:0.8;}
                25%{transform:translateY(25vh) rotate(90deg) translateX(40px);opacity:0.7;}
                50%{transform:translateY(50vh) rotate(180deg) translateX(-30px);opacity:0.6;}
                75%{transform:translateY(75vh) rotate(270deg) translateX(20px);opacity:0.4;}
                100%{transform:translateY(105vh) rotate(360deg) translateX(-10px);opacity:0;}
            }
            .navbar{
                position:sticky;top:0;z-index:100;
                background:rgba(255,255,255,0.75);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
                border-bottom:1px solid rgba(255,180,200,0.4);padding:12px 20px;
                display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;
            }
            .nav-btn{
                padding:10px 20px;border-radius:25px;border:1.5px solid var(--pink-300);
                background:var(--white);color:var(--pink-500);cursor:pointer;
                font-size:0.9rem;font-weight:600;transition:all 0.3s;font-family:inherit;white-space:nowrap;letter-spacing:0.5px;
            }
            .nav-btn:hover{background:var(--pink-100);border-color:var(--pink-400);transform:translateY(-1px);box-shadow:var(--shadow);}
            .nav-btn.active{background:var(--pink-500);color:#fff;border-color:var(--pink-500);box-shadow:0 4px 16px rgba(255,82,134,0.4);}
            .main-container{max-width:750px;margin:0 auto;padding:24px 16px 80px;position:relative;z-index:1;}
            .section{display:none;animation:fadeSlideIn 0.5s ease;}
            .section.active{display:block;}
            @keyframes fadeSlideIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
            .content-block{
                background:rgba(255,255,255,0.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
                border-radius:var(--radius);padding:24px;margin-bottom:20px;
                border:1px solid rgba(255,200,220,0.5);box-shadow:var(--shadow);transition:all 0.3s;
                display:flex;flex-direction:column;gap:16px;
            }
            .content-block:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);}
            .content-block .block-media{width:100%;border-radius:var(--radius-sm);overflow:hidden;background:#fce4ec;display:none;}
            .content-block .block-media.has-media{display:block;}
            .content-block .block-media img{width:100%;height:auto;display:block;border-radius:var(--radius-sm);max-height:400px;object-fit:cover;}
            .content-block .block-media video{width:100%;height:auto;display:block;border-radius:var(--radius-sm);max-height:350px;object-fit:contain;background:#000;}
            .content-block .block-text{line-height:1.8;font-size:0.95rem;color:var(--text);white-space:pre-wrap;word-break:break-word;}
            .section-title{text-align:center;margin-bottom:24px;}
            .section-title h2{font-size:1.5rem;color:var(--pink-500);display:inline-flex;align-items:center;gap:8px;letter-spacing:1px;}
            .section-title h2 .icon{font-size:1.8rem;}
            .music-indicator{
                position:fixed;bottom:20px;right:20px;z-index:150;
                background:rgba(255,255,255,0.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
                border-radius:25px;padding:10px 18px;border:1px solid rgba(255,200,220,0.5);
                box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;
                font-size:0.8rem;font-weight:600;color:var(--pink-500);cursor:pointer;transition:all 0.3s;
            }
            .music-indicator:hover{box-shadow:var(--shadow-lg);}
            .music-indicator .dot{width:8px;height:8px;border-radius:50%;background:#16a34a;animation:pulse 1.2s ease-in-out infinite;display:none;}
            .music-indicator .dot.playing{display:block;}
            .music-indicator .dot.paused{display:block;background:#ea580c;animation:none;}
            @keyframes pulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(1.6);}}
            .hidden-audio{display:none;}
            @media(max-width:600px){
                .content-block{padding:16px;gap:12px;}
                .nav-btn{padding:8px 14px;font-size:0.78rem;}
                .navbar{gap:4px;padding:10px 10px;}
                .music-indicator{bottom:12px;right:12px;padding:8px 14px;font-size:0.7rem;}
            }
        </style>
        </head>
        <body>
        <div class="petals-container" id="petalsContainer"></div>
        <nav class="navbar">
            <button class="nav-btn active" data-section="memories">💌 我们的回忆</button>
            <button class="nav-btn" data-section="status">💔 目前的状态</button>
            <button class="nav-btn" data-section="solution">💡 解决办法</button>
            <button class="nav-btn" data-section="future">🌈 未来会好的</button>
        </nav>
        <div class="main-container">
            <div class="section active" id="section-memories">
                <div class="section-title"><h2><span class="icon">💌</span> 我们的回忆</h2></div>
                <div id="content-memories"></div>
            </div>
            <div class="section" id="section-status">
                <div class="section-title"><h2><span class="icon">💔</span> 目前的状态</h2></div>
                <div id="content-status"></div>
            </div>
            <div class="section" id="section-solution">
                <div class="section-title"><h2><span class="icon">💡</span> 解决办法</h2></div>
                <div id="content-solution"></div>
            </div>
            <div class="section" id="section-future">
                <div class="section-title"><h2><span class="icon">🌈</span> 未来会好的</h2></div>
                <div id="content-future"></div>
            </div>
        </div>
        <div class="music-indicator" id="musicIndicator" title="点击切换播放/暂停">
            <span class="dot" id="musicDot"></span>
            <span id="musicLabel">🎵 未播放</span>
        </div>
        <audio id="bgMusic" loop class="hidden-audio"></audio>
        <script>
        (function(){
            const EMBEDDED_DATA = `{
        "memories": {
                "pairs": [
                        {
                                "type": "image",
                                "url": "https://gips2.baidu.com/it/u=3313679121,637406067&fm=3074&app=3074&f=PNG",
                                "text": "还记得我们第一次见面吗？那天阳光很好，你穿了一件我永远忘不了的衣服。"
                        },
                        {
                                "type": "image",
                                "url": "",
                                "text": "一起走过的那些日子，每一个瞬间都刻在我心里。"
                        },
                        {
                                "type": "image",
                                "url": "",
                                "text": "啊啊啊啊啊啊啊啊啊啊啊啊啊"
                        },
                        {
                                "type": "image",
                                "url": "",
                                "text": " 啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊"
                        }
                ]
        },
        "status": {
                "pairs": [
                        {
                                "type": "image",
                                "url": "",
                                "text": "我们分开了...但这不代表我们之间的感情消失了。"
                        },
                        {
                                "type": "image",
                                "url": "",
                                "text": "我每天都在想你，想知道你过得好不好。"
                        }
                ]
        },
        "solution": {
                "pairs": [
                        {
                                "type": "image",
                                "url": "",
                                "text": "我想了很多，我知道问题出在哪里了。"
                        },
                        {
                                "type": "image",
                                "url": "",
                                "text": "我会改，真的会改。不是因为我想挽回你，而是因为我想成为更好的人。"
                        }
                ]
        },
        "future": {
                "pairs": [
                        {
                                "type": "image",
                                "url": "",
                                "text": "我相信我们还有未来。"
                        },
                        {
                                "type": "image",
                                "url": "",
                                "text": "给我一个机会，让我们重新开始，好吗？💗"
                        }
                ]
        },
        "musicUrl": "https://music.163.com/song/media/outer/url?id=3356010050.mp3"
}`;
            const pageData = JSON.parse(EMBEDDED_DATA);

            // 渲染板块
            const contentContainers={
                memories:document.getElementById('content-memories'),
                status:document.getElementById('content-status'),
                solution:document.getElementById('content-solution'),
                future:document.getElementById('content-future')
            };

            function renderSection(key){
                const container=contentContainers[key];
                const pairs=pageData[key].pairs||[];
                container.innerHTML='';
                pairs.forEach(pair=>{
                    const block=document.createElement('div');
                    block.className='content-block';
                    if(pair.url&&pair.url.trim()){
                        const mediaDiv=document.createElement('div');
                        mediaDiv.className='block-media has-media';
                        if(pair.type==='video'){
                            const v=document.createElement('video');
                            v.src=pair.url.trim();v.controls=true;v.playsinline=true;v.preload='metadata';
                            mediaDiv.appendChild(v);
                        }else{
                            const i=document.createElement('img');
                            i.src=pair.url.trim();i.alt='';i.loading='lazy';
                            mediaDiv.appendChild(i);
                        }
                        block.appendChild(mediaDiv);
                    }
                    const textDiv=document.createElement('div');
                    textDiv.className='block-text';
                    textDiv.textContent=pair.text||'';
                    block.appendChild(textDiv);
                    container.appendChild(block);
                });
            }
            ['memories','status','solution','future'].forEach(renderSection);

            // 音乐
            const bgMusic=document.getElementById('bgMusic');
            const musicDot=document.getElementById('musicDot');
            const musicLabel=document.getElementById('musicLabel');
            const musicIndicator=document.getElementById('musicIndicator');
            let musicPlayAttempted=false;

            function updateUI(s){
                musicDot.classList.remove('playing','paused');
                switch(s){
                    case'playing':musicDot.classList.add('playing');musicLabel.textContent='🎵 正在播放';musicIndicator.style.color='#16a34a';break;
                    case'paused':musicDot.classList.add('paused');musicLabel.textContent='⏸️ 已暂停';musicIndicator.style.color='#ea580c';break;
                    case'blocked':musicDot.classList.add('paused');musicLabel.textContent='🔇 点击任意位置播放';musicIndicator.style.color='#ea580c';break;
                    default:musicLabel.textContent='🎵 未播放';musicIndicator.style.color='#ff5286';
                }
            }

            function playMusic(){
                if(!bgMusic.src&&pageData.musicUrl){bgMusic.src=pageData.musicUrl;bgMusic.load();}
                bgMusic.play().then(()=>updateUI('playing')).catch(()=>updateUI('blocked'));
            }
            function toggleMusic(){
                if(bgMusic.paused||bgMusic.ended)playMusic();
                else{bgMusic.pause();updateUI('paused');}
            }

            bgMusic.addEventListener('play',()=>updateUI('playing'));
            bgMusic.addEventListener('pause',()=>{if(bgMusic.src&&!bgMusic.ended)updateUI('paused');});
            musicIndicator.addEventListener('click',toggleMusic);

            function attemptAutoPlay(){
                if(!musicPlayAttempted){
                    musicPlayAttempted=true;
                    if(pageData.musicUrl&&pageData.musicUrl.trim()){
                        if(!bgMusic.src||bgMusic.src!==pageData.musicUrl.trim()){
                            bgMusic.src=pageData.musicUrl.trim();bgMusic.load();
                        }
                        bgMusic.play().then(()=>updateUI('playing')).catch(()=>updateUI('blocked'));
                    }
                }
            }
            document.addEventListener('click',attemptAutoPlay,{once:false});
            document.addEventListener('touchstart',attemptAutoPlay,{once:false});
            document.addEventListener('scroll',attemptAutoPlay,{once:true});
            window.addEventListener('load',()=>{setTimeout(attemptAutoPlay,500);});

            // 导航
            const navBtns=document.querySelectorAll('.nav-btn');
            const sections={memories:document.getElementById('section-memories'),status:document.getElementById('section-status'),solution:document.getElementById('section-solution'),future:document.getElementById('section-future')};
            navBtns.forEach(btn=>{
                btn.addEventListener('click',()=>{
                    navBtns.forEach(b=>b.classList.remove('active'));
                    btn.classList.add('active');
                    const key=btn.dataset.section;
                    Object.values(sections).forEach(s=>s.classList.remove('active'));
                    sections[key].classList.add('active');
                    attemptAutoPlay();
                });
            });

            // 花瓣
            const petals=['🌸','💮','🌷','🩷','✨','💗','🌺','💖'];
            const container=document.getElementById('petalsContainer');
            for(let i=0;i<25;i++){
                const p=document.createElement('span');
                p.className='petal';
                p.textContent=petals[Math.floor(Math.random()*petals.length)];
                p.style.left=Math.random()*100+'%';
                p.style.fontSize=(Math.random()*1.5+0.8)+'rem';
                p.style.animationDuration=(Math.random()*8+8)+'s';
                p.style.animationDelay=Math.random()*10+'s';
                p.style.opacity=Math.random()*0.5+0.3;
                container.appendChild(p);
            }

            // 初始加载音乐
            if(pageData.musicUrl){bgMusic.src=pageData.musicUrl;bgMusic.load();}
        })();
        </script>
        </body>
        </html>

kit-backdrop-filter:blur(10px);border-radius:22px;padding:8px 14px;border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;gap:6px;font-size:0.7rem;font-weight:600;color:#fff;cursor:pointer}.music-indicator .dot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:pulse 1.2s ease-in-out infinite;display:none}.music-indicator .dot.playing{display:block}.music-indicator .dot.paused{display:block;background:#fb923c;animation:none}@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.3;transform:scale(1.6)}}.btn-back-home{position:absolute;top:max(50px,calc(var(--safe-top) + 38px));left:12px;z-index:20;background:rgba(0,0,0,0.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,0.15);color:rgba(255,255,255,0.7);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:0.8rem;display:flex;align-items:center;justify-content:center}.hidden-audio{display:none}.quiz-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);z-index:400;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}.quiz-overlay.hidden{display:none}.quiz-box{background:rgba(30,30,30,0.95);border-radius:20px;padding:32px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.5);max-width:340px;width:88%;border:1px solid rgba(255,255,255,0.15)}.quiz-box .quiz-icon{font-size:3rem;margin-bottom:12px}.quiz-box h3{font-size:1.1rem;color:#ff5286;margin-bottom:6px}.quiz-box .quiz-question{font-size:0.9rem;color:rgba(255,255,255,0.8);margin-bottom:18px;line-height:1.5}.quiz-box .quiz-hint{font-size:0.7rem;color:rgba(255,255,255,0.4);margin-bottom:12px}.quiz-box input{width:100%;border:2px solid rgba(255,255,255,0.2);border-radius:22px;padding:11px 16px;font-size:1rem;text-align:center;font-family:inherit;background:rgba(255,255,255,0.06);color:#fff;transition:all 0.3s;outline:none;margin-bottom:14px}.quiz-box input:focus
